server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html references the built JS/CSS bundle by content-hashed
    # filename (Vite's default), so the bundle files themselves are safe to
    # cache aggressively — but index.html itself must never be served stale,
    # or a browser can keep running yesterday's JS against today's API
    # indefinitely, since the hashed filename it would need to fetch to
    # update is only known by reading a fresh index.html in the first place.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
