name: guardpipe

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guardpipe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guardpipe}
      POSTGRES_DB: ${POSTGRES_DB:-guardpipe}
    ports:
      - "5432:5432"
    volumes:
      # Bind mount, not a named volume, so the data directory is a real,
      # browsable/backup-able host folder instead of living opaquely inside
      # Docker Desktop's own VM disk. Defaults to a repo-local, gitignored
      # folder so this works with zero setup on any contributor's machine;
      # override GUARDPIPE_POSTGRES_DATA_DIR in your own .env to point it
      # somewhere else (e.g. a dedicated data drive) — see
      # documentation/13-devops-and-environments.md §5.
      - ${GUARDPIPE_POSTGRES_DATA_DIR:-./.docker-data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guardpipe}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # --appendonly yes: Redis is still explicitly losable by design
    # (03-architecture-overview.md / CLAUDE.md "Technology baseline" — nothing
    # in the queue/cache layer assumes data survives a restart), but there's
    # no reason to throw away a working local dev queue on every `docker
    # compose down` when persisting it is free. AOF, not just the default RDB
    # snapshot interval, so a clean `docker compose down` (SIGTERM) flushes
    # state rather than only periodic snapshots.
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ${GUARDPIPE_REDIS_DATA_DIR:-./.docker-data/redis}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local stand-in for Amazon SES: catches every email the backend sends
  # (GUARDPIPE_MAIL_BACKEND=smtp, GUARDPIPE_SMTP_ADDR=mailpit:1025) and shows
  # it at http://localhost:8025 — nothing ever leaves the machine. Pinned
  # rather than :latest, like every other image here.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 500

  guardpipe:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - workspace:/var/lib/guardpipe/workspace
    # The runtime image runs as USER nonroot:nonroot (uid/gid 65532,
    # Dockerfile) — no shell, so no usermod/chgrp is possible to fix this any
    # other way. The bind-mounted docker.sock is root:root, mode 0660 on
    # Docker Desktop (and on a native Linux host with the daemon's default
    # config), so nonroot has neither owner nor group access to it without
    # this: group_add supplies gid 0 as a supplementary group at container
    # start, purely via the container runtime, satisfying the socket's group
    # permission bit without running the process itself as root. If a given
    # host's docker.sock is owned by a dedicated "docker" group instead of
    # root (some native Linux distros), swap 0 for that group's numeric GID.
    group_add:
      - "0"
    healthcheck:
      test: ["CMD", "/app/guardpipe", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  guardpipe-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # frontend/.env.production's relative /api/v1 relies on the EKS ALB
        # routing /api/* to the backend; locally nothing does, so point the
        # browser straight at the published backend port instead.
        VITE_API_BASE_URL: http://localhost:8080/api/v1
    ports:
      - "5173:80"
    depends_on:
      guardpipe:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Phase 12 Pass 2 (pentest): the sandboxed tool image — never distroless
  # (needs a real shell plus a long CLI tool list), never pushed to any
  # registry, only ever referenced by the local tag `docker compose build`
  # gives it. Not started as a long-running service — no `command:`/ports —
  # adapters/sandbox creates one short-lived container per script
  # invocation from this image via the Docker socket, the same
  # Docker-outside-of-Docker shape sonar-scanner/Trivy already use.
  pentest-sandbox:
    build:
      context: .
      dockerfile: internal/scripts/pentest/Dockerfile
    profiles:
      - build-only

  # Phase 7 (codescan, ADR-0011): self-hosted SonarQube Community Edition,
  # not SonarCloud — keeps the zero-budget/local-only constraint intact and
  # supports private repos. Dedicated Postgres DB, not shared with `postgres`
  # above, matching the module-boundary shape every other adapter-backed
  # engine uses (depscan<->OSV, containerscan<->adapters/dockerx).
  sonarqube-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${SONARQUBE_DB_USER:-sonarqube}
      POSTGRES_PASSWORD: ${SONARQUBE_DB_PASSWORD:-local-dev-only-changeme}
      POSTGRES_DB: ${SONARQUBE_DB_NAME:-sonarqube}
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONARQUBE_DB_USER:-sonarqube}"]
      interval: 5s
      timeout: 5s
      retries: 10

  sonarqube:
    image: sonarqube:community
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/${SONARQUBE_DB_NAME:-sonarqube}
      SONAR_JDBC_USERNAME: ${SONARQUBE_DB_USER:-sonarqube}
      SONAR_JDBC_PASSWORD: ${SONARQUBE_DB_PASSWORD:-local-dev-only-changeme}
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      # sonarqube:community's own image has curl but no wget (Ubuntu 24.04
      # base) — unlike this project's own distroless images, which have
      # neither and need the "guardpipe healthcheck" subcommand instead.
      # Confirmed by exec'ing into a running container; don't switch back to
      # wget without re-checking.
      test: ["CMD-SHELL", "curl -f -s http://127.0.0.1:9000/api/system/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    # Needs real memory (Elasticsearch under the hood) — a few GB, not the
    # ~25MB distroless footprint the rest of this stack has. If it fails to
    # boot with an Elasticsearch bootstrap-check error on Docker Desktop
    # (WSL2 backend), that's a vm.max_map_count issue, not a config bug here.

volumes:
  # Named explicitly (see the networks.default note below for why) —
  # codescan's sonar-scanner container (internal/adapters/sonarqube/scanner.go)
  # mounts this volume *by name* (GUARDPIPE_WORKSPACE_VOLUME) to read the
  # checkout guardpipe cloned, rather than bind-mounting WorkspaceRoot's path:
  # that path (/var/lib/guardpipe/workspace/scan-*) only means something
  # inside the guardpipe container's own mount namespace — the sibling
  # container is created by the Docker daemon via the shared socket, so a
  # bind-mount source is resolved against the daemon host's filesystem, not
  # guardpipe's, and silently mounts an empty directory instead (codescan
  # fails fast with no source files found). Mounting the named volume, with
  # VolumeOptions.Subpath for the specific scan-* subdirectory, is what
  # actually works for this Docker-outside-of-Docker sibling-container shape.
  workspace:
    name: guardpipe-workspace
  # containerscan's Trivy sibling containers (internal/adapters/trivy/scanner.go)
  # mount this by name to persist the vulnerability database across scans —
  # without it, GUARDPIPE_TRIVY_DB_UPDATE=true re-downloads several hundred
  # MB from scratch into a container removed the moment the scan finishes,
  # a real contributor to containerscan blowing its engine timeout.
  trivy_cache:
    name: guardpipe-trivy-cache
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

# Named explicitly (rather than relying on the "<project>_default" naming
# Compose derives automatically from the top-level `name:`) so
# GUARDPIPE_DOCKER_NETWORK has a stable, predictable value to default to.
# codescan's sonar-scanner container (internal/adapters/sonarqube/scanner.go)
# is launched as a sibling via the Docker socket, not declared as a Compose
# service here, so it has to be told which network to join to reach
# `sonarqube` by hostname — this is that network.
networks:
  default:
    name: guardpipe-net
