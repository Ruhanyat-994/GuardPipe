# golangci-lint config — v2 schema (required: golangci-lint-action@v7 only
# supports golangci-lint v2, not v1 — see .github/workflows/ci.yml's
# pinned `version:`).
#
# errcheck.exclude-functions: (*gin.Context).Error's return value is the
# same *gin.Error already appended to c.Errors — it is never nil (Gin
# panics if you pass it a nil error) and carries no failure signal of its
# own to check. Every handler and middleware in this codebase calls
# c.Error(err) and lets ErrorMapper render it from c.Errors later
# (documentation/04-backend-architecture.md §4.1) — checking the return
# value here is not idiomatic Gin usage, not a real bug, and without this
# exclusion errcheck flags essentially every handler in the codebase.
version: "2"
linters:
  settings:
    errcheck:
      exclude-functions:
        - (*github.com/gin-gonic/gin.Context).Error
        # Deferred Close() on a short-lived migration-only DB handle and an
        # HTTP response body — the standard, widely-recommended errcheck
        # exclusion for this pattern (a Close() error here is not
        # actionable at the defer site). Kept as two precise entries
        # rather than a blanket io.Closer exclusion, so a future Close()
        # that genuinely needs its error checked (e.g. flush-on-close for
        # a file writer) isn't silently swallowed by this rule.
        - (*database/sql.DB).Close
        - (io.ReadCloser).Close
