# SonarQube's bundled Elasticsearch refuses to start below
# vm.max_map_count=262144 — a node-level kernel setting, not something a
# container's own securityContext can set for itself. This DaemonSet runs
# on every node (harmless everywhere else; sysctl tuning doesn't affect
# other pods) with a privileged init container that sets it once, then the
# main container just sleeps forever — there's nothing left to do after the
# init container runs, but a DaemonSet needs a running main container to
# stay alive and keep re-applying on any node that reboots/gets replaced.
# Same root requirement docker-compose.yml's own SonarQube service comment
# already flags for local Docker Desktop (WSL2 backend) — this is that same
# constraint's Kubernetes-native answer.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sysctl-tuning
  namespace: sonarqube
spec:
  selector:
    matchLabels:
      app: sysctl-tuning
  template:
    metadata:
      labels:
        app: sysctl-tuning
    spec:
      hostPID: true
      initContainers:
        - name: set-vm-max-map-count
          image: public.ecr.aws/docker/library/busybox:1.36
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - sysctl -w vm.max_map_count=262144
      containers:
        - name: pause
          image: public.ecr.aws/docker/library/busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 10m
              memory: 16Mi
