# SonarQube Community Edition — codescan's analysis backend (ADR-0011).
# One replica: Community Edition doesn't support more anyway, and this is a
# supporting service, not the app. Its own UI/API is never exposed outside
# the cluster (CLAUDE.md: "Neither wrapped tool's own UI/reports is ever
# exposed to a GuardPipe user") — no Ingress here on purpose.
#
# Database: a second database inside the EXISTING guardpipe-db RDS
# instance, not a separate RDS instance (one-time manual `CREATE DATABASE
# sonarqube` — see AWS-VERIFICATION.md for the exact steps taken). RDS_HOST/
# RDS_PORT below are the same ${...} placeholders infra.yml's envsubst step
# already substitutes for 04-api.yaml/05-worker.yaml — reused here, not
# redefined.
#
# The DB password is a plain Kubernetes Secret in this namespace, created
# once by hand (kubectl create secret), not routed through SSM/the Secrets
# Store CSI driver the way the app's own secrets are — this is SonarQube's
# own internal credential, never read by guardpipe-api/-worker, so it
# doesn't need to go through that pipeline. See AWS-VERIFICATION.md.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sonarqube
  namespace: sonarqube
spec:
  serviceName: sonarqube
  replicas: 1
  selector:
    matchLabels:
      app: sonarqube
  template:
    metadata:
      labels:
        app: sonarqube
    spec:
      # Waits for the sysctl DaemonSet's init container to have already run
      # on this pod's node — StatefulSet pods aren't otherwise ordered
      # against a DaemonSet, but the DaemonSet is applied first in this
      # directory's own numbering (01- before 02-) and reconciles fast
      # (a few seconds), so in practice this is rarely a real race; if
      # SonarQube's own pod ever does land before the sysctl fix has taken
      # effect on that node, it fails its own Elasticsearch bootstrap check
      # and CrashLoopBackOffs until the DaemonSet catches up, then recovers
      # on its own next restart — not a silent failure.
      securityContext:
        fsGroup: 1000
      containers:
        - name: sonarqube
          image: sonarqube:community
          env:
            - name: SONAR_JDBC_URL
              value: "jdbc:postgresql://${RDS_HOST}:${RDS_PORT}/sonarqube"
            - name: SONAR_JDBC_USERNAME
              value: "sonarqube"
            - name: SONAR_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sonarqube-db-credentials
                  key: password
            # Tuned down from SonarQube's own defaults to fit a shared
            # t3.medium (4GB total) alongside whatever else lands on this
            # node — Elasticsearch's Xms=Xmx on purpose (its own best
            # practice, avoids a heap-resize pause under load).
            - name: SONAR_WEB_JAVAOPTS
              value: "-Xmx512m -Xms128m"
            - name: SONAR_CE_JAVAOPTS
              value: "-Xmx512m -Xms128m"
            - name: SONAR_SEARCH_JAVAOPTS
              value: "-Xms512m -Xmx512m"
          ports:
            - containerPort: 9000
              name: http
          volumeMounts:
            - name: data
              mountPath: /opt/sonarqube/data
              subPath: data
            - name: data
              mountPath: /opt/sonarqube/extensions
              subPath: extensions
            - name: data
              mountPath: /opt/sonarqube/logs
              subPath: logs
          readinessProbe:
            httpGet:
              path: /api/system/status
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/system/status
              port: 9000
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 1500m
              memory: 3Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: sonarqube
  namespace: sonarqube
spec:
  selector:
    app: sonarqube
  ports:
    - port: 9000
      targetPort: 9000
