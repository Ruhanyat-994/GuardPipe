# No domain, no ACM cert (DEPLOYMENT.md §7) — the ALB's own AWS-generated
# hostname (*.elb.amazonaws.com) is the public URL, plain HTTP. infra.yml
# polls for and prints this hostname, then patches
# GUARDPIPE_BASE_URL/GUARDPIPE_CORS_ORIGINS (01-configmap.yaml) to it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: guardpipe
  namespace: guardpipe
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          # More specific path first — everything under /api/* goes to the
          # Go API, everything else (the SPA and its own client-side
          # routing) to nginx.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: guardpipe-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: guardpipe-web
                port:
                  number: 80
