# Secrets Store CSI Driver + its AWS provider (installed via deploy/k8s/
# addons/) mount these — the three application secrets from SSM Parameter
# Store (Standard tier, SecureString — cheaper than Secrets Manager for
# values nothing rotates automatically, see persistent/main.tf), the RDS
# master password from Secrets Manager (native rotation, can't move) — and,
# via secretObjects below, also sync them into a native Kubernetes Secret
# (guardpipe-secrets) that 04-api.yaml/05-worker.yaml consume with envFrom.
# Real secret *values* are never in this repo (DEPLOYMENT.md §6) — only a
# parameter name (SSM) or ARN (Secrets Manager), substituted from Terraform
# outputs by infra.yml, same as 01-configmap.yaml.
#
# A pod must actually mount this class's CSI volume for the secretObjects
# sync to happen at all — it's not a standalone controller, the sync
# piggybacks on the volume mount lifecycle (see the "secrets-store"
# volumeMount in 04-api.yaml/05-worker.yaml).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: guardpipe-secrets
  namespace: guardpipe
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "${JWT_SECRET_PARAM}"
        objectAlias: "jwt_secret"
        objectType: "ssmparameter"
      - objectName: "${ENCRYPTION_KEY_PARAM}"
        objectAlias: "encryption_key"
        objectType: "ssmparameter"
      - objectName: "${GEMINI_API_KEY_PARAM}"
        objectAlias: "gemini_api_key"
        objectType: "ssmparameter"
      - objectName: "${SONARQUBE_TOKEN_PARAM}"
        objectAlias: "sonarqube_token"
        objectType: "ssmparameter"
      - objectName: "${RDS_MASTER_SECRET_ARN}"
        objectAlias: "rds_master"
        objectType: "secretsmanager"
        jmesPath:
          - path: "username"
            objectAlias: "db_username"
          - path: "password"
            objectAlias: "db_password"
  secretObjects:
    - secretName: guardpipe-secrets
      type: Opaque
      data:
        - objectName: jwt_secret
          key: GUARDPIPE_JWT_SECRET
        - objectName: encryption_key
          key: GUARDPIPE_ENCRYPTION_KEY
        - objectName: gemini_api_key
          key: GUARDPIPE_GEMINI_API_KEY
        - objectName: sonarqube_token
          key: GUARDPIPE_SONARQUBE_TOKEN
        - objectName: db_username
          key: DB_USERNAME
        - objectName: db_password
          key: DB_PASSWORD
