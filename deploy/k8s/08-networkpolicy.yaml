# Default-deny + explicit allows (DEPLOYMENT.md §4). Only takes effect
# because cluster/main.tf's vpc-cni addon has enableNetworkPolicy=true —
# the default EKS VPC CNI config enforces nothing at all, silently, without
# that (see the comment there).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: guardpipe
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# DNS must be allowed explicitly even for policies that only care about
# egress elsewhere — every other allow-rule below depends on a pod being
# able to resolve a name first (the RDS endpoint, Secrets Manager's/Gemini's/
# OSV's/GitHub's hostnames, redis's own Service DNS name).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: guardpipe
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# AWS APIs (Secrets Manager, STS for IRSA) plus Gemini/OSV/GitHub — all
# plain HTTPS to hosts outside the cluster, so there's no in-cluster
# pod/namespace selector to scope this to; only api/worker call any of them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-https-egress
  namespace: guardpipe
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["guardpipe-api", "guardpipe-worker"]
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
# RDS lives in the persistent VPC but outside the pod network, so this is
# scoped by CIDR, not a namespace/pod selector — must match
# infra/terraform/persistent/variables.tf's vpc_cidr if that default (10.0.0.0/16)
# is ever changed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-egress
  namespace: guardpipe
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["guardpipe-api", "guardpipe-worker"]
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis
  namespace: guardpipe
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["guardpipe-api", "guardpipe-worker"]
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-redis-egress
  namespace: guardpipe
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["guardpipe-api", "guardpipe-worker"]
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
---
# The ALB's target-group traffic arrives from ENIs outside the pod network
# (DEPLOYMENT.md §3's target-type: ip) — there's no pod/namespace selector
# to scope this to, same reasoning as allow-https-egress above.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-alb
  namespace: guardpipe
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["guardpipe-api", "guardpipe-web"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
---
# adapters/k8scodescanscanner's own Job pods — a different identity shape
# from every policy above (a fresh, per-job "guardpipe.io/codescan-run"
# label value each run, matched here via `Exists` so this one static policy
# covers every codescan Job regardless of its specific run ID, rather than
# that adapter creating a matching per-job NetworkPolicy the way
# adapters/k8spentestsandbox does for its own Jobs — codescan's Jobs need
# broad egress to actually clone an arbitrary public repository, unlike
# pentest's target-IP-only isolation, so there's no narrower rule a per-job
# policy would even buy here). Confirmed live 2026-09-14: without this, a
# codescan Job's git clone just hung against default-deny-all until the
# Job's own deadline killed it — allow-https-egress above looked like it
# should already cover this and didn't, because its podSelector only
# matches app=guardpipe-api/-worker, never these Job pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-codescan-job-egress
  namespace: guardpipe
spec:
  podSelector:
    matchExpressions:
      - key: guardpipe.io/codescan-run
        operator: Exists
  policyTypes: ["Egress"]
  egress:
    # The git clone (github.com or any other public HTTPS remote).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    # sonar-scanner-cli itself, reaching SonarQube's own Service in its
    # separate namespace (deploy/k8s/addons/sonarqube/) — cross-namespace
    # traffic is blocked by default-deny-all the same as anything else
    # without an explicit allow.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sonarqube
      ports:
        - protocol: TCP
          port: 9000
---
# adapters/k8strivyscanner's own Job pods (engines/containerscan on the
# Kubernetes backend) — same Exists-selector shape as the codescan Job policy
# above. Trivy needs HTTPS to download its vulnerability database and check
# bundle, and to pull the base image it scans straight from its registry
# (Docker Hub, ghcr.io, public ECR, ...). No other egress: its input
# Dockerfiles arrive in a ConfigMap, never over the network.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-containerscan-job-egress
  namespace: guardpipe
spec:
  podSelector:
    matchExpressions:
      - key: guardpipe.io/containerscan-run
        operator: Exists
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
# adapters/sonarqube.Client's own HTTP calls (GetTask/SearchIssues/
# SearchHotspots/GetRule) are made directly from engines/codescan.Engine,
# which runs inside guardpipe-worker's own process — not from a Job pod — so
# allow-codescan-job-egress above (scoped to guardpipe.io/codescan-run Job
# pods only) doesn't cover this traffic. Confirmed live 2026-09-14: the
# sonar-scanner Job itself completed and exited successfully, but the
# engine's post-scan GetTask poll from guardpipe-worker then hung against
# default-deny-all until its own timeout ("dial tcp ...:9000: i/o timeout").
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-worker-to-sonarqube-egress
  namespace: guardpipe
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["guardpipe-api", "guardpipe-worker"]
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sonarqube
      ports:
        - protocol: TCP
          port: 9000
