# Every non-secret GUARDPIPE_* env var (DEPLOYMENT.md §4). Real secrets
# (JWT/encryption/Gemini keys, RDS credentials) come from
# 02-secretproviderclass.yaml instead — never here.
#
# ${...} placeholders are substituted by infra.yml's "start" job (envsubst,
# values pulled straight from Terraform outputs) before this is applied —
# never edited by hand. GUARDPIPE_BASE_URL/GUARDPIPE_CORS_ORIGINS start as
# an obviously-fake placeholder because the ALB hostname doesn't exist until
# *after* this ConfigMap is first applied (the Ingress that creates it reads
# this same manifest set) — infra.yml patches both to the real hostname and
# rolls guardpipe-api/guardpipe-worker once the ALB is up, later in the same
# job. See RUNBOOK.md for how to redo this by hand if it's ever needed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: guardpipe-config
  namespace: guardpipe
data:
  GUARDPIPE_ENV: "production"
  GUARDPIPE_HTTP_PORT: "8080"
  GUARDPIPE_LOG_LEVEL: "info"
  GUARDPIPE_BASE_URL: "http://pending.invalid"
  GUARDPIPE_CORS_ORIGINS: "http://pending.invalid"
  # Temporary: this deployment has no domain/ACM cert yet, so the ALB serves
  # plain HTTP. A Secure-flagged refresh-token cookie is silently refused by
  # browsers over an insecure connection, which broke session persistence
  # across a page reload — confirmed live 2026-09-14. Flip this back to
  # "true" (or remove it, since Env=="production" is the default again) the
  # moment real HTTPS is in front of the app.
  GUARDPIPE_SECURE_COOKIES: "false"

  # Not read directly by platform/config — these three exist only so
  # 04-api.yaml/05-worker.yaml can compose GUARDPIPE_DATABASE_URL via
  # Kubernetes' native $(VAR) env-value references (the runtime image has no
  # shell to do it with a script). See the comment there for why the DSN
  # uses libpq keyword/value form, not a postgres:// URL.
  DB_HOST: "${RDS_HOST}"
  DB_PORT: "${RDS_PORT}"
  DB_NAME: "${RDS_DB_NAME}"

  GUARDPIPE_DB_MAX_CONNS: "25"
  GUARDPIPE_REDIS_URL: "redis://redis.guardpipe.svc.cluster.local:6379/0"
  # Only guardpipe-api overrides this to "true" (its own env entry takes
  # precedence over this ConfigMap) — running it on both Deployments would
  # let two replicas race goose migrations on every rollout.
  GUARDPIPE_MIGRATE_ON_START: "false"

  GUARDPIPE_WORKSPACE_ROOT: "/var/lib/guardpipe/workspace"
  GUARDPIPE_MAX_REPO_MB: "500"
  GUARDPIPE_WORKER_COUNT: "4"

  # Real tool execution via the Kubernetes Jobs API — this cluster has no
  # Docker daemon reachable from guardpipe-worker at all. One shared backend
  # knob for both engines that need it: pentest
  # (adapters/k8spentestsandbox, deploy/k8s/09-pentest-sandbox-rbac.yaml)
  # and codescan (adapters/k8scodescanscanner) both read
  # GUARDPIPE_SANDBOX_BACKEND — they should always agree on which backend
  # this deployment uses, not carry two independent settings that could
  # drift apart. containerscan isn't an engine this binary even attempts
  # without its own K8s-native rework (Trivy has the identical Docker-socket
  # problem, not yet fixed here) — nothing extra to enable for that one.
  GUARDPIPE_PENTEST_ENABLED: "true"
  GUARDPIPE_SANDBOX_BACKEND: "kubernetes"
  GUARDPIPE_K8S_SANDBOX_IMAGE: "${ECR_PENTEST_SANDBOX_URL}:${IMAGE_TAG}"
  # SonarQube (deploy/k8s/addons/sonarqube/) — a supporting service in its
  # own namespace, reached cross-namespace by its Service's full cluster-DNS
  # name. GUARDPIPE_SONARQUBE_TOKEN comes from 02-secretproviderclass.yaml
  # instead (a real secret, not a plain ConfigMap value) — generated once by
  # hand from SonarQube's own first-boot admin UI, see AWS-VERIFICATION.md.
  GUARDPIPE_SONARQUBE_API_URL: "http://sonarqube.sonarqube.svc.cluster.local:9000"

  GUARDPIPE_AI_ENABLED: "true"
  GUARDPIPE_GEMINI_MODEL_FAST: "gemini-2.5-flash"
  # gemini-2.5-pro 404s on a free-tier key (.env.example's own note,
  # BUILD_GUIDE.md Phase 13) — pointed at flash here too.
  GUARDPIPE_GEMINI_MODEL_SMART: "gemini-2.5-flash"
  GUARDPIPE_AI_TOKEN_BUDGET_PER_SCAN: "100000"

  # Scan-report emails (modules/notification). "log" until an SES sender
  # identity exists and is verified (infra/terraform/persistent's
  # ses_sender_identity) — then set "ses" and a From address at that
  # identity. SES credentials come from the guardpipe-app IAM role (IRSA);
  # no AWS key is ever configured here. Email links use the first
  # GUARDPIPE_CORS_ORIGINS entry (the ALB URL) unless GUARDPIPE_APP_URL is set.
  GUARDPIPE_MAIL_BACKEND: "log"
  GUARDPIPE_MAIL_FROM: "GuardPipe <reports@guardpipe.local>"
  # GUARDPIPE_SES_REGION: defaults to AWS_REGION, which the EKS pod identity
  # webhook injects alongside the IRSA credentials.

  GUARDPIPE_GATE_WARN: "30"
  GUARDPIPE_GATE_BLOCK: "70"
