apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  namespace: default
spec:
  template:
    spec:
      containers:
      - name: api
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        securityContext:
          allowPrivilegeEscalation: {{ .Values.allowPrivilegeEscalation }}
