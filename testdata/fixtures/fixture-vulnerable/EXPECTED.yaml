# Golden fixture catalogue (documentation/15-testing-strategy.md §5).
# Counts cover depscan's deterministic, file-content-only rules —
# depscan.vuln.known-cve/no-fix-available depend on modules/advisory (OSV
# lookups), which tests never call live; those two are covered separately
# in engine_test.go against a fake advisory.Service, not against this
# fixture's real dependency versions.
rules:
  - id: depscan.hygiene.no-lockfile
    count: 1
    reason: "package.json has no package-lock.json"
  - id: depscan.hygiene.wildcard-version
    count: 1
    reason: "package.json pins left-pad to \"*\""
  - id: depscan.secrets.committed-credential
    count: 1
    reason: "config.py has a hardcoded AWS access key"
  - id: depscan.secrets.env-file-committed
    count: 1
    reason: ".env is tracked (not .env.example, which must not fire)"
  - id: depscan.secrets.key-file-committed
    count: 1
    reason: "id_rsa is tracked by filename convention"

# Deliberately absent from this repo, to prove the near-misses stay quiet:
# - config.py's DEFAULT_PASSWORD="changeme" and DB_PASSWORD=os.environ[...]
# - .env.example (the safe template convention)
# - requirements.txt is pinned (==), so it counts as its own lockfile —
#   no depscan.hygiene.no-lockfile for the pypi ecosystem

# k8sscan (BUILD_GUIDE.md Phase 9). Two workloads exist here: k8s/deployment.yaml
# (raw) and charts/api's rendered Deployment (Helm) — neither hardens beyond
# what each planted violation needs, so the "fires by default when a field
# is simply absent" rules (allow-priv-escalation, runs-as-root,
# caps-not-dropped, writable-root-fs, no-resource-limits, automount-sa-token,
# default-sa-used, mutable-image-tag, no-probes, psa-level) correctly fire
# on *both*, count 2 — that's not double-counting a bug, it's two genuinely
# unhardened workloads. Counts below are the real output of a live engine
# run against this fixture, not hand-computed.
  - id: k8sscan.workload.privileged
    count: 1
    reason: "k8s/deployment.yaml's container sets privileged: true"
  - id: k8sscan.workload.host-network
    count: 1
    reason: "k8s/deployment.yaml's pod sets hostNetwork: true"
  - id: k8sscan.workload.hostpath-mount
    count: 1
    reason: "k8s/deployment.yaml mounts /var/run/docker.sock via hostPath"
  - id: k8sscan.workload.allow-priv-escalation
    count: 2
    reason: "raw: unset (defaults to allowed); Helm chart: values.yaml sets it true"
  - id: k8sscan.workload.runs-as-root
    count: 2
    reason: "neither workload sets runAsNonRoot"
  - id: k8sscan.workload.caps-not-dropped
    count: 2
    reason: "neither workload sets capabilities.drop: [ALL]"
  - id: k8sscan.workload.writable-root-fs
    count: 2
    reason: "neither workload sets readOnlyRootFilesystem: true"
  - id: k8sscan.workload.no-resource-limits
    count: 2
    reason: "neither workload sets resources.limits"
  - id: k8sscan.workload.automount-sa-token
    count: 2
    reason: "neither workload disables automountServiceAccountToken"
  - id: k8sscan.workload.default-sa-used
    count: 2
    reason: "neither workload sets serviceAccountName"
  - id: k8sscan.workload.mutable-image-tag
    count: 2
    reason: "both images are tag-only (nginx:latest, myorg/api:latest) — no @sha256 digest"
  - id: k8sscan.workload.no-probes
    count: 2
    reason: "neither workload configures liveness/readiness probes"
  - id: k8sscan.workload.psa-level
    count: 2
    reason: "informational — always emitted once per workload, both land at level \"privileged\""
  - id: k8sscan.rbac.wildcard-verbs
    count: 1
    reason: "k8s/rbac.yaml's ClusterRole grants verbs: [\"*\"]"
  - id: k8sscan.rbac.wildcard-resources
    count: 1
    reason: "k8s/rbac.yaml's ClusterRole grants resources: [\"*\"]"
  - id: k8sscan.rbac.wildcard-apigroups
    count: 1
    reason: "k8s/rbac.yaml's ClusterRole grants apiGroups: [\"*\"]"
  - id: k8sscan.rbac.cluster-admin-binding
    count: 1
    reason: "k8s/rbac.yaml's ClusterRoleBinding grants cluster-admin"
  - id: k8sscan.rbac.default-sa-bound
    count: 1
    reason: "the same binding's subject is the default ServiceAccount"
  - id: k8sscan.network.no-networkpolicy
    count: 2
    reason: "no NetworkPolicy exists anywhere in this fixture — both workloads' namespace is unprotected"
  - id: k8sscan.secrets.literal-in-manifest
    count: 1
    reason: "k8s/secret.yaml carries data inline"
  - id: k8sscan.secrets.env-from-secret-all
    count: 1
    reason: "k8s/deployment.yaml's container uses envFrom.secretRef instead of a single secretKeyRef"

# k8sscan near-misses deliberately absent from this repo:
# - k8sscan.rbac.secrets-read-cluster-wide/pod-create/escalate-bind/impersonate/exec-attach:
#   the planted ClusterRole only grants the three wildcard rules above
# - k8sscan.workload.dangerous-capabilities/host-pid-ipc: neither workload sets
#   a dangerous capability, hostPID, or hostIPC
# - k8sscan.network.allow-all-egress/nodeport-service/loadbalancer-no-source-ranges:
#   no NetworkPolicy or Service manifest is planted at all

# cicdscan (BUILD_GUIDE.md Phase 10). Six workflow files under
# .github/workflows/ each plant a focused subset of the 16 Core rules —
# counts below are the real engine's own output (New(nil), no AI service,
# so only the deterministic rule pass runs), not hand-computed; several
# rules fire more than once because the same broad grant/pattern is
# deliberately repeated across more than one file (documented per rule
# below, not a bug in either the fixture or the rule).
  - id: cicdscan.supply-chain.unpinned-action
    count: 8
    reason: "every uses: in this fixture is pinned by a mutable tag (@v4/@v1), never a full SHA — pwn-request.yml(2) + self-hosted.yml(1) + release.yml(2) + excessive-permissions.yml(1) + workflow-run.yml(1) + injection-attempt.yml(1)"
  - id: cicdscan.supply-chain.unverified-action
    count: 1
    reason: "pwn-request.yml's some-random-org/some-action@v1 — not on the trusted-publisher list"
  - id: cicdscan.supply-chain.curl-pipe-shell
    count: 1
    reason: "pwn-request.yml pipes a downloaded install.sh straight into bash"
  - id: cicdscan.supply-chain.unpinned-install
    count: 2
    reason: "release.yml's pip install requests (no ==) + self-hosted.yml's npm install -g some-cli-tool (no @version)"
  - id: cicdscan.trigger.pull-request-target-checkout
    count: 1
    reason: "pwn-request.yml's checkout step sets ref: github.event.pull_request.head.sha under a pull_request_target trigger"
  - id: cicdscan.trigger.workflow-run-untrusted
    count: 1
    reason: "workflow-run.yml downloads an artifact referencing github.event.workflow_run.id"
  - id: cicdscan.injection.script-injection
    count: 1
    reason: "pwn-request.yml's last step interpolates github.event.pull_request.title directly into run:"
  - id: cicdscan.permissions.missing-block
    count: 2
    reason: "self-hosted.yml and reusable-caller.yml declare no top-level permissions: block at all"
  - id: cicdscan.permissions.write-all
    count: 1
    reason: "pwn-request.yml's top-level permissions: write-all"
  - id: cicdscan.permissions.excessive-token
    count: 2
    reason: "excessive-permissions.yml's job.permissions.contents:write with no write-like step, plus pwn-request.yml's workflow-level write-all inherited by its job, whose steps (checkout/some-action/curl/echo) also don't look like they write"
  - id: cicdscan.secrets.echoed
    count: 1
    reason: "release.yml echoes secrets.NPM_TOKEN directly"
  - id: cicdscan.secrets.inherit
    count: 1
    reason: "reusable-caller.yml's job calls a reusable workflow with secrets: inherit"
  - id: cicdscan.secrets.in-condition
    count: 1
    reason: "release.yml's if: references secrets.PUBLISH_KEY"
  - id: cicdscan.runner.self-hosted-public
    count: 1
    reason: "self-hosted.yml runs on: self-hosted under the fork-reachable pull_request trigger"
  - id: cicdscan.runner.unpinned-image
    count: 1
    reason: "self-hosted.yml's container: image: node:18 has no @sha256 digest"
  - id: cicdscan.artifact.upload-sensitive
    count: 1
    reason: "release.yml uploads path: .env as a build artifact"

# cicdscan near-misses deliberately absent from this repo:
# - cicdscan.ai.semantic-finding/cicdscan.security.prompt-injection-attempt:
#   both require a real or faked AI provider call — golden-fixture tests run
#   with New(nil) (no AI service) precisely to stay deterministic; both are
#   covered instead by internal/engines/cicdscan/aipass_test.go's dedicated
#   fake-provider tests (TestEngine_Run_AIPass_AddsASemanticFinding,
#   TestEngine_Run_AIPass_PromptInjectionAttempt). injection-attempt.yml's
#   planted comment ("ignore previous instructions...") is there for a real
#   live-AI manual verification pass, documented in the file itself.
